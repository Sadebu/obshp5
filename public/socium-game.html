<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>СОЦИУМ: жизнь в обществе</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f2e;--bg2:#1a1a4e;--card:#231f5c;--accent:#00d4aa;--yellow:#ffd93d;--coral:#ff6b6b;--purple:#a78bfa;--blue:#60a5fa;--green:#4ade80;--red:#ef4444;--text:#e2e8f0;--dim:#94a3b8;--radius:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,var(--bg),var(--bg2),#2d1b4e);color:var(--text);min-height:100vh;overflow-x:hidden}
button{cursor:pointer;border:none;font-family:inherit}
.screen{display:none;min-height:100vh;padding:16px;animation:fadeIn .5s}
.screen.active{display:flex;flex-direction:column;align-items:center}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.title{font-size:clamp(2rem,6vw,3.5rem);font-weight:900;text-align:center;background:linear-gradient(135deg,var(--accent),var(--yellow),var(--coral));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:20px 0;animation:pulse 3s infinite;font-family:Georgia,serif}
.subtitle{font-size:clamp(1rem,3vw,1.3rem);color:var(--dim);text-align:center;margin-bottom:30px;letter-spacing:.15em;text-transform:uppercase}
.menu-btn{display:block;width:min(320px,90%);padding:16px 24px;margin:10px auto;border-radius:var(--radius);font-size:1.1rem;font-weight:700;color:#fff;transition:all .3s;text-align:center;text-transform:uppercase;letter-spacing:.05em}
.menu-btn:hover{transform:translateY(-3px);box-shadow:0 8px 25px rgba(0,0,0,.3)}
.btn-new{background:linear-gradient(135deg,#059669,#00d4aa)}
.btn-cont{background:linear-gradient(135deg,#2563eb,#60a5fa)}
.btn-rules{background:linear-gradient(135deg,#7c3aed,#a78bfa)}
.btn-gloss{background:linear-gradient(135deg,#d97706,#ffd93d);color:#1a1a2e}
.btn-settings{background:linear-gradient(135deg,#dc2626,#ff6b6b)}
.btn-teacher{background:linear-gradient(135deg,#8b5cf6,#6366f1)}
.btn-download{background:linear-gradient(135deg,#10b981,#059669)}
.hud{position:sticky;top:0;z-index:100;width:100%;max-width:800px;background:rgba(13,11,46,.95);backdrop-filter:blur(10px);border-radius:0 0 var(--radius) var(--radius);padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.res-bar{flex:1;min-width:80px;max-width:160px}
.res-label{font-size:.65rem;color:var(--dim);display:flex;justify-content:space-between;font-weight:600}
.res-label span:last-child{color:var(--accent);font-weight:700}
.res-track{height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;margin-top:2px}
.res-fill{height:100%;border-radius:4px;transition:width .8s}
.game-area{width:100%;max-width:800px;flex:1;display:flex;flex-direction:column;align-items:center;padding:16px 0}
.scene-img{width:100%;max-width:500px;height:auto;margin:10px 0;border-radius:var(--radius);overflow:hidden;animation:float 4s ease-in-out infinite;position:relative}
.scene-img::before{content:'';position:absolute;inset:-3px;background:linear-gradient(45deg,var(--accent),var(--purple),var(--yellow),var(--coral));border-radius:19px;z-index:-1;opacity:.6;animation:shimmer 3s linear infinite;background-size:200% 100%}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
.scene-img svg{width:100%;height:auto;display:block}
.scene-text{background:var(--card);border-radius:var(--radius);padding:20px;width:100%;max-width:700px;line-height:1.8;font-size:clamp(.95rem,2.5vw,1.1rem);margin:10px 0;animation:fadeIn .4s}
.scene-text::first-letter{font-size:1.3em;font-weight:700;color:var(--accent);float:left;margin-right:.1em}
.scene-title{font-size:clamp(1.8rem,4.5vw,2.5rem);font-weight:900;background:linear-gradient(135deg,var(--yellow),var(--coral),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.75rem;font-family:Georgia,serif;text-align:center}
.scene-act{font-size:.85rem;color:var(--accent);margin-bottom:1rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.concept-note{padding:1.5rem;background:linear-gradient(135deg,rgba(0,212,170,.15),rgba(155,89,182,.1));border:2px solid rgba(0,212,170,.4);border-radius:18px;margin:10px 0;font-size:1rem;font-weight:600;color:var(--accent);max-width:700px;width:100%;position:relative}
.concept-note::after{content:'💡';position:absolute;top:1rem;right:1rem;font-size:1.5rem;animation:float 2s infinite}
.choices{width:100%;max-width:700px;display:flex;flex-direction:column;gap:8px;margin:10px 0}
.choice-btn{background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:2px solid rgba(255,255,255,.12);border-radius:16px;padding:1.2rem 1.5rem;color:var(--text);font-size:1.1rem;font-weight:500;text-align:left;transition:all .4s;line-height:1.6}
.choice-btn:hover{background:linear-gradient(135deg,rgba(0,212,170,.15),rgba(155,89,182,.1));border-color:var(--accent);transform:translateX(8px) scale(1.02);box-shadow:0 8px 24px rgba(0,212,170,.2);color:var(--accent)}
.status-badge{display:inline-block;padding:6px 14px;border-radius:20px;font-size:.8rem;font-weight:700;margin:3px;transition:all .3s}
.badge-blue{background:rgba(96,165,250,.2);color:var(--blue);border:2px solid var(--blue)}
.badge-purple{background:rgba(167,139,250,.2);color:var(--purple);border:2px solid var(--purple)}
.badge-green{background:rgba(74,222,128,.2);color:var(--green);border:2px solid var(--green)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(13,11,46,.95);backdrop-filter:blur(15px);padding:10px 16px;display:flex;justify-content:center;gap:10px;z-index:100;border-top:2px solid rgba(0,212,170,.2);flex-wrap:wrap}
.nav-btn{padding:8px 16px;border-radius:20px;font-size:.8rem;font-weight:700;color:var(--dim);background:var(--card);transition:all .3s;text-transform:uppercase;letter-spacing:.03em}
.nav-btn:hover{color:var(--accent);background:rgba(0,212,170,.1)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(5px);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:linear-gradient(135deg,var(--bg2),#2d1b4e);border:3px solid rgba(0,212,170,.3);border-radius:28px;padding:2.5rem;max-width:600px;width:100%;max-height:85vh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:12px;right:12px;background:var(--coral);color:#fff;border-radius:50%;width:32px;height:32px;font-size:1.2rem;display:flex;align-items:center;justify-content:center}
.modal h2{font-size:2rem;font-weight:900;background:linear-gradient(135deg,var(--yellow),var(--coral));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:1.5rem;font-family:Georgia,serif}
.create-form{width:100%;max-width:500px;background:var(--card);border-radius:var(--radius);padding:24px;border:2px solid rgba(255,255,255,.1)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.95rem;color:var(--accent);margin-bottom:6px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.form-group input,.form-group select{width:100%;padding:12px;border-radius:12px;border:2px solid rgba(255,255,255,.15);background:var(--bg);color:var(--text);font-size:1.05rem;font-weight:500}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 20px rgba(0,212,170,.2)}
.form-group select option{background:var(--bg2);color:var(--text)}
.minigame-area{width:100%;max-width:700px;background:var(--card);border-radius:var(--radius);padding:20px;margin:10px 0}
.passport{background:var(--card);border-radius:var(--radius);padding:24px;width:100%;max-width:700px;margin:10px 0;border:3px solid rgba(255,215,0,.3)}
.passport h2{text-align:center;color:var(--yellow);margin-bottom:16px;font-family:Georgia,serif}
.passport-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--accent);color:#0d0b2e;padding:12px 24px;border-radius:var(--radius);font-weight:700;z-index:300;animation:toastAnim 3s forwards}
@keyframes toastAnim{0%{opacity:0;transform:translateX(-50%) translateY(-20px)}10%{opacity:1;transform:translateX(-50%) translateY(0)}90%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-20px)}}
.glossary-item{padding:1.25rem;margin-bottom:.85rem;border-radius:14px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);transition:all .3s}
.glossary-item:hover{border-color:var(--yellow);transform:translateY(-3px)}
.glossary-term{font-weight:800;font-size:1.15rem;background:linear-gradient(135deg,var(--yellow),var(--coral));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem;font-family:Georgia,serif}
.glossary-def{font-size:.95rem;color:var(--text);line-height:1.7}
.teacher-student{padding:1rem;background:rgba(255,255,255,.05);border-radius:12px;margin:.5rem 0;cursor:pointer;transition:all .3s;border:2px solid transparent}
.teacher-student:hover{border-color:var(--accent);transform:translateX(5px)}
.ending-title{font-size:clamp(2.5rem,6vw,4rem);font-weight:900;background:linear-gradient(135deg,var(--accent),var(--yellow),var(--coral),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2rem;font-family:Georgia,serif;text-align:center;animation:float 3s infinite}
.ending-text{font-size:clamp(1.15rem,2.8vw,1.4rem);line-height:1.9;max-width:650px;margin-bottom:2.5rem;text-align:justify}
@media(max-width:600px){.hud{gap:4px}.res-bar{min-width:60px}.scene-img{height:auto}}
</style>
</head>
<body>

<!-- START SCREEN -->
<div id="screen-start" class="screen active">
<div id="start-logo"></div>
<h1 class="title">СОЦИУМ</h1>
<p class="subtitle">Жизнь в обществе · §5 · 10 класс</p>
<button class="menu-btn btn-new" onclick="showScreen('create')">🎮 Новая игра</button>
<button class="menu-btn btn-cont" onclick="loadGame()">📂 Продолжить</button>
<button class="menu-btn btn-rules" onclick="openModal('rules')">📖 Правила игры</button>
<button class="menu-btn btn-gloss" onclick="openModal('glossary')">📚 Глоссарий</button>
<button class="menu-btn btn-teacher" onclick="showScreen('teacher')">👨‍🏫 Режим учителя</button>
</div>

<!-- CREATE CHARACTER -->
<div id="screen-create" class="screen">
<h2 class="title" style="font-size:2rem">Создание персонажа</h2>
<div class="create-form">
<div class="form-group"><label>Имя</label><input id="inp-name" placeholder="Введите имя..." maxlength="20"></div>
<div class="form-group"><label>Пол</label><select id="inp-sex"><option value="male">Мужской</option><option value="female">Женский</option></select></div>
<div class="form-group"><label>Район города Социум</label><select id="inp-district"><option value="Рабочий район">Рабочий район</option><option value="Спальный район">Спальный район</option><option value="Центр">Центр</option><option value="Приморский район">Приморский район</option></select></div>
<div class="form-group"><label>Тип семьи</label><select id="inp-family"><option value="Рабочая семья">Рабочая семья</option><option value="Семья учителей/врачей">Семья учителей/врачей</option><option value="Семья предпринимателей">Семья предпринимателей</option><option value="Неполная семья">Неполная семья</option><option value="Семья мигрантов">Семья мигрантов</option></select></div>
<button class="menu-btn btn-new" onclick="startGame()" style="margin-top:20px">Начать жизнь →</button>
<button class="menu-btn btn-settings" onclick="showScreen('start')">← Назад</button>
</div>
</div>

<!-- GAME SCREEN -->
<div id="screen-game" class="screen">
<div class="hud" id="hud"></div>
<div class="game-area" id="game-area"></div>
<div class="bottom-nav">
<button class="nav-btn" onclick="openModal('journal')">📓 Журнал</button>
<button class="nav-btn" onclick="openModal('statuses')">👤 Статусы</button>
<button class="nav-btn" onclick="openModal('glossary')">📚 Глоссарий</button>
<button class="nav-btn" onclick="saveGame()">💾 Сохранить</button>
<button class="nav-btn btn-download" onclick="exportProgress()" style="background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff">📤 Для учителя</button>
</div>
</div>

<!-- TEACHER SCREEN -->
<div id="screen-teacher" class="screen">
<h2 class="title" style="font-size:2rem">👨‍🏫 Режим учителя</h2>
<div style="width:100%;max-width:800px">
<div style="background:rgba(255,255,255,.05);border-radius:16px;padding:1.5rem;margin-bottom:2rem;border:2px solid rgba(255,255,255,.1)">
<h3 style="color:var(--accent);margin-bottom:1rem">📥 Импорт результатов учеников</h3>
<p style="color:var(--dim);margin-bottom:1rem;font-size:.9rem">Загрузите JSON-файлы, которые экспортировали ученики</p>
<label class="menu-btn btn-new" style="cursor:pointer;display:inline-block;margin:0">
Выбрать файлы
<input type="file" accept=".json" multiple onchange="importStudents(event)" style="display:none">
</label>
<div id="teacher-stats" style="margin-top:1rem"></div>
<div id="teacher-list" style="margin-top:1rem"></div>
</div>
<button class="menu-btn btn-settings" onclick="showScreen('start')">← Назад в меню</button>
</div>
</div>

<!-- ENDING SCREEN -->
<div id="screen-ending" class="screen">
<div id="ending-content"></div>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
<div class="modal" onclick="event.stopPropagation()">
<button class="modal-close" onclick="closeModal()">✕</button>
<div id="modal-content"></div>
</div>
</div>

// ===== STATE =====
let S = null;
const SAVE_KEY = 'socicum_save_v2';

function defaultState(){
return {
name:'',sex:'male',age:14,district:'',family:'',
resources:{income:30,education:20,prestige:25,power:10,socialConnections:20,familyWellbeing:50,innerStability:60,reputation:30},
statuses:['подросток','житель Социума'],achievedStatuses:[],
roles:['ученик','ребёнок в семье'],
flags:{},achievements:[],journal:[],
conflicts:[],mobilityEvents:[],socialLifts:[],strata:'Начальное положение',
currentScene:'a1_s1',sceneHistory:[],ending:null,
studentCode:'',minigameScores:{},
};
}

const DISTRICT_BONUS = {
'Рабочий район':{income:-10,prestige:-5,innerStability:10,socialConnections:10},
'Спальный район':{income:0,education:5,familyWellbeing:10,innerStability:5},
'Центр':{income:10,prestige:10,education:5,socialConnections:5},
'Приморский район':{income:5,innerStability:15,socialConnections:5,reputation:5},
};
const FAMILY_BONUS = {
'Рабочая семья':{income:-5,socialConnections:15,innerStability:5,prestige:-5},
'Семья учителей/врачей':{education:15,prestige:10,income:5,reputation:10},
'Семья предпринимателей':{income:20,power:10,prestige:10,socialConnections:5},
'Неполная семья':{innerStability:-10,familyWellbeing:-10,reputation:5,power:5},
'Семья мигрантов':{socialConnections:-5,innerStability:10,reputation:5,income:-10},
};

// ===== UTILS =====
function showScreen(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById('screen-'+id).classList.add('active');
if(id==='teacher')renderTeacher();
}

function openModal(type){
const mc = document.getElementById('modal-content');
if(type==='rules'){
mc.innerHTML=`<h2>📖 Правила игры</h2><div style="font-size:.9rem;line-height:1.7;color:var(--dim)">
<p><strong>СОЦИУМ</strong> — сюжетная обучающая игра по обществознанию §5.</p><br>
<p><strong>Как играть:</strong></p>
<ul style="padding-left:1.5rem;margin:.5rem 0"><li>Создай персонажа</li><li>Читай сцены и делай выбор</li><li>Каждый выбор влияет на ресурсы</li><li>Проходи мини-игры</li><li>В конце получи «Социологический паспорт»</li></ul><br>
<p><strong>Ресурсы:</strong> доход, образование, престиж, власть, связи, семья, устойчивость, репутация.</p><br>
<p><strong>Продолжительность:</strong> 20–30 минут</p></div><br>
<button class="menu-btn btn-new" onclick="closeModal()">Понятно!</button>`;
}else if(type==='glossary'){
let html='<h2>📚 Глоссарий</h2>';
for(const[term,def]of Object.entries(GLOSSARY)){
html+=`<div class="glossary-item"><div class="glossary-term">${term}</div><div class="glossary-def">${def}</div></div>`;
}
mc.innerHTML=html;
}else if(type==='journal'){
let html='<h2>📓 Журнал событий</h2>';
if(!S.journal.length)html+='<p style="color:var(--dim)">Журнал пока пуст.</p>';
else S.journal.forEach(item=>{
html+=`<div class="glossary-item"><div class="glossary-term">${item}</div>`;
if(GLOSSARY[item])html+=`<div class="glossary-def">${GLOSSARY[item]}</div>`;

}else if(type==='statuses'){
let html='<h2>👤 Статусы и роли</h2>';
html+='<h3 style="color:var(--blue);margin:1rem 0 .5rem">📌 Предписанные статусы</h3>';
S.statuses.forEach(s=>html+=`<span class="status-badge badge-blue">${s}</span>`);

if(!S.achievedStatuses.length)html+='<p style="color:var(--dim)">Пока нет</p>';
else S.achievedStatuses.forEach(s=>html+=`<span class="status-badge badge-purple">${s}</span>`);
html+='<h3 style="color:var(--green);margin:1rem 0 .5rem">🎭 Роли</h3>';
S.roles.forEach(r=>html+=`<span class="status-badge badge-green">${r}</span>`);

}

}

function closeModal(e){
if(e&&e.target!==e.currentTarget)return;
document.getElementById('modal-overlay').classList.remove('show');
}

function toast(msg){
const t=document.createElement('div');
t.className='toast';
t.textContent=msg;
document.body.appendChild(t);
setTimeout(()=>t.remove(),3000);
}

function genCode(){
const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
let code='SOC-';
for(let i=0;i<6;i++)code+=c[Math.floor(Math.random()*c.length)];
return code;
}

// ===== SAVE/LOAD =====
function saveGame(){
if(!S)return;
localStorage.setItem(SAVE_KEY,JSON.stringify(S));
toast('💾 Игра сохранена!');
}

function loadGame(){
const data=localStorage.getItem(SAVE_KEY);
if(!data){toast('❌ Нет сохранений');return;}
try{S=JSON.parse(data);showScreen('game');renderScene();}
catch(e){toast('❌ Ошибка загрузки');}
}

function exportProgress(){
if(!S){toast('❌ Нет данных');return;}
const data={version:'2.0',exportedAt:new Date().toISOString(),studentCode:S.studentCode,progress:S};
const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;a.download=`СОЦИУМ_${S.studentCode}_${S.name}.json`;
document.body.appendChild(a);a.click();a.remove();
URL.revokeObjectURL(url);
toast('📤 Файл экспортирован!');
}

// ===== START GAME =====
function startGame(){
const name=document.getElementById('inp-name').value.trim();
if(!name){toast('❌ Введите имя');return;}
S=defaultState();
S.name=name;
S.sex=document.getElementById('inp-sex').value;
S.district=document.getElementById('inp-district').value;
S.family=document.getElementById('inp-family').value;
S.studentCode=genCode();
const db=DISTRICT_BONUS[S.district]||{};
const fb=FAMILY_BONUS[S.family]||{};
for(const[k,v]of Object.entries(db))S.resources[k]=Math.max(0,Math.min(100,S.resources[k]+v));
for(const[k,v]of Object.entries(fb))S.resources[k]=Math.max(0,Math.min(100,S.resources[k]+v));
showScreen('game');
renderScene();
}

// ===== RENDER =====
function renderHUD(){
const hud=document.getElementById('hud');
const res=[
['income','💰 Доход'],['education','📚 Образование'],['prestige','⭐ Престиж'],['power','👑 Власть'],
['socialConnections','🤝 Связи'],['familyWellbeing','🏠 Семья'],['innerStability','🧘 Устойчивость'],['reputation','📣 Репутация']
];
hud.innerHTML=res.map(([k,label])=>{
const v=S.resources[k];
const colors={income:'#4ade80',education:'#60a5fa',prestige:'#ffd93d',power:'#ff6b6b',socialConnections:'#a78bfa',familyWellbeing:'#f472b6',innerStability:'#00d4aa',reputation:'#fb923c'};
return`<div class="res-bar"><div class="res-label"><span>${label}</span><span>${v}</span></div><div class="res-track"><div class="res-fill" style="width:${v}%;background:${colors[k]}"></div></div></div>`;
}).join('');
}

function renderScene(){
if(!S)return;
const scene=SCENES.find(s=>s.id===S.currentScene);
if(!scene){showEnding();return;}
renderHUD();
const area=document.getElementById('game-area');
const ageMap={1:14,2:17+Math.floor(S.sceneHistory.length%7),3:25+Math.floor(S.sceneHistory.length%7)};
const age=ageMap[scene.act]||14;
let html=`<div class="scene-act">Акт ${scene.act} · Возраст: ${age} лет · Код: ${S.studentCode}</div>`;
html+=`<h2 class="scene-title">${scene.title}</h2>`;
if(scene.img&&SVGS[scene.img])html+=`<div class="scene-img">${SVGS[scene.img]}</div>`;
html+=`<div class="scene-text">${scene.text}</div>`;
if(scene.conceptNote)html+=`<div class="concept-note">${scene.conceptNote}</div>`;
html+='<div class="choices">';
scene.choices.forEach((c,i)=>{
html+=`<button class="choice-btn" onclick="makeChoice(${i})">${c.text}</button>`;
});
html+='</div>';
area.innerHTML=html;
}

function makeChoice(idx){
const scene=SCENES.find(s=>s.id===S.currentScene);
const choice=scene.choices[idx];
// Effects
if(choice.effects){
for(const[k,v]of Object.entries(choice.effects)){
S.resources[k]=Math.max(0,Math.min(100,S.resources[k]+v));
}
}
if(choice.flags)Object.assign(S.flags,choice.flags);
if(choice.addStatus&&!S.achievedStatuses.includes(choice.addStatus))S.achievedStatuses.push(choice.addStatus);
if(choice.addRole&&!S.roles.includes(choice.addRole))S.roles.push(choice.addRole);
if(choice.addJournal&&!S.journal.includes(choice.addJournal))S.journal.push(choice.addJournal);
if(choice.addConflict)S.conflicts.push(choice.addConflict);
if(choice.addMobility&&!S.mobilityEvents.includes(choice.addMobility))S.mobilityEvents.push(choice.addMobility);
if(choice.addLift&&!S.socialLifts.includes(choice.addLift))S.socialLifts.push(choice.addLift);
S.sceneHistory.push(S.currentScene);
// Strata
const avg=(S.resources.income+S.resources.education+S.resources.prestige+S.resources.power)/4;
if(avg>65)S.strata='Высший слой';
else if(avg>50)S.strata='Средний слой';
else if(avg>35)S.strata='Ниже среднего';
else S.strata='Низший слой';
// Minigame or next scene
if(choice.minigame){
startMinigame(choice.minigame,choice.next);
}else if(choice.next==='ending'){
showEnding();
}else{
S.currentScene=choice.next;
renderScene();
window.scrollTo(0,0);
}
}

// ===== ENDING =====
function showEnding(){
const r=S.resources;
let ending='stable',title='',text='';
if(r.prestige>60&&r.income>50&&r.education>50){ending='ascending';title='Восходящая мобильность';text='Твой персонаж поднялся в социальной структуре благодаря образованию, работе и связям.';}
else if(r.innerStability>50&&r.familyWellbeing>50&&Math.abs(r.income-50)<20){ending='stable';title='Устойчивое среднее положение';text='Твой персонаж нашёл баланс между семьёй, работой и обществом.';}
else if(r.income<25&&r.prestige<25){ending='descending';title='Нисходящая мобильность';text='Твой персонаж потерял социальное положение из-за кризиса или неверных решений.';}
else if(r.socialConnections>60&&S.conflicts.length>=2){ending='bridge';title='Социальный мост';text='Твой персонаж стал посредником, помогающим разрешать конфликты.';}
else if(r.socialConnections<20&&r.familyWellbeing<30){ending='loner';title='Одиночка';text='Твой персонаж отверг институты и связи, но оказался уязвим.';}
else if(r.power>60&&r.reputation<40){ending='systemic';title='Системный игрок';text='Твой персонаж научился использовать систему, но столкнулся с моральным выбором.';}
else if(r.prestige>55&&r.education>55&&r.socialConnections>55){ending='architect';title='Архитектор Социума';text='Твой персонаж понял общество как систему и получил возможность влиять на городские правила.';}
S.ending=ending;
const el=document.getElementById('ending-content');
el.innerHTML=`
${SVGS.passport?`<div class="scene-img" style="max-width:300px">${SVGS.passport}</div>`:''}
<h1 class="ending-title">${title}</h1>
<p class="ending-text">${text}</p>
<div class="passport">
<h2>📋 Социологический паспорт</h2>
<div style="background:rgba(155,89,182,.15);padding:1rem;border-radius:12px;border:2px solid var(--purple);margin-bottom:1rem;text-align:center">

</div>

<div class="passport-row"><span>Семья:</span><span>${S.family}</span></div>

<div class="passport-row"><span>Роли:</span><span>${S.roles.length}</span></div>
<div class="passport-row"><span>Социальные лифты:</span><span>${S.socialLifts.join(', ')||'нет'}</span></div>

</div>

function resetGame(){
localStorage.removeItem(SAVE_KEY);
S=null;
showScreen('start');
}

<p style="color:var(--dim);margin-bottom:1rem">Распредели людей по слоям. Нажимай на человека, чтобы переместить в следующий слой.</p>
<div id="pyr-people"></div>
<button class="menu-btn btn-new" onclick="completeMinigame('${nextScene}',70)" style="margin-top:1rem">Завершить ✓</button>`;
}else if(type==='elevator'){
html+=`<h2 style="color:var(--yellow);margin-bottom:1rem">🏢 Социальный лифт</h2>
<p style="color:var(--dim);margin-bottom:1rem">Выбери правильные каналы мобильности.</p>
<div id="elev-q"></div>`;
}else if(type==='conflict'){
html+=`<h2 style="color:var(--yellow);margin-bottom:1rem">🔗 Конфликтный узел</h2>
<p style="color:var(--dim);margin-bottom:1rem">Определи причину и повод конфликта.</p>
<div id="conf-q"></div>`;
}else if(type==='institutions'){
html+=`<h2 style="color:var(--yellow);margin-bottom:1rem">🏛️ Институциональный пазл</h2>
<p style="color:var(--dim);margin-bottom:1rem">Определи, к какому институту относится ситуация.</p>
<div id="inst-q"></div>`;
}
html+='</div>';
area.innerHTML=html;
if(type==='web')initWebGame();
else if(type==='pyramid')initPyramidGame();
else if(type==='elevator')initElevatorGame(nextScene);
else if(type==='conflict')initConflictGame(nextScene);
else if(type==='institutions')initInstitutionsGame(nextScene);
}

function completeMinigame(nextScene,score){
S.minigameScores[nextScene]=score;
const bonus=Math.round(score/100*10);
S.resources.education=Math.min(100,S.resources.education+bonus);
S.resources.reputation=Math.min(100,S.resources.reputation+Math.round(bonus/2));
S.currentScene=nextScene;
renderScene();
window.scrollTo(0,0);
}

function initWebGame(){
const nodes=['Человек','Группа','Институт','Сфера жизни','Норма','Ценность','Символ'];
const valid=[['Человек','Группа'],['Группа','Институт'],['Институт','Сфера жизни'],['Сфера жизни','Норма'],['Норма','Ценность'],['Ценность','Символ'],['Человек','Институт'],['Группа','Норма']];
let selected=null;
let connections=[];
const cont=document.getElementById('web-nodes');
nodes.forEach(n=>{
const btn=document.createElement('button');
btn.className='choice-btn';
btn.style.cssText='padding:10px 16px;font-size:.9rem;flex:0 0 auto';
btn.textContent=n;
btn.onclick=()=>{
if(!selected){selected=n;btn.style.borderColor='var(--accent)';btn.style.background='rgba(0,212,170,.2)';}
else if(selected!==n){
const pair=[selected,n].sort();
const isValid=valid.some(v=>v[0]===pair[0]&&v[1]===pair[1]);
if(isValid&&!connections.includes(pair.join('-'))){
connections.push(pair.join('-'));
document.getElementById('web-count').textContent=`Связей: ${connections.length}/5`;
if(connections.length>=5)document.getElementById('web-done').style.display='block';
}
cont.querySelectorAll('button').forEach(b=>{b.style.borderColor='rgba(255,255,255,.12)';b.style.background='linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.02))';});
selected=null;
}else{
cont.querySelectorAll('button').forEach(b=>{b.style.borderColor='rgba(255,255,255,.12)';b.style.background='linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.02))';});
selected=null;
}
};
cont.appendChild(btn);
});
}

function initPyramidGame(){
const people=[
{name:'Топ-менеджер',layer:'Элита'},{name:'Врач',layer:'Средний слой'},
{name:'Рабочий',layer:'Низший слой'},{name:'Депутат',layer:'Элита'},
{name:'Предприниматель',layer:'Высший слой'},{name:'Студент',layer:'Низший слой'}
];
const layers=['Элита','Высший слой','Средний слой','Низший слой'];
const cont=document.getElementById('pyr-people');
people.forEach((p,i)=>{
p.current=0;
const div=document.createElement('div');
div.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:10px;margin:5px 0;background:rgba(255,255,255,.05);border-radius:10px';
div.innerHTML=`<span>${p.name}</span><button class="nav-btn" id="pyr-btn-${i}" onclick="cyclePyramid(${i})">${layers[0]}</button>`;
cont.appendChild(div);
});
window._pyrPeople=people;
window._pyrLayers=layers;
}
function cyclePyramid(i){
const p=window._pyrPeople[i];
p.current=(p.current+1)%window._pyrLayers.length;
document.getElementById('pyr-btn-'+i).textContent=window._pyrLayers[p.current];
}

function initElevatorGame(nextScene){
const questions=[
{q:'Что является социальным лифтом?',opts:['Образование','Переезд','Смена причёски'],correct:0},
{q:'Брак с человеком другого статуса — это...',opts:['Горизонтальная мобильность','Вертикальная мобильность','Не мобильность'],correct:1},
{q:'Что НЕ является социальным лифтом?',opts:['Карьера','Лотерея','Случайная встреча'],correct:2},
];
let qi=0,score=0;
function render(){
const cont=document.getElementById('elev-q');
if(qi>=questions.length){
cont.innerHTML=`<p style="color:var(--accent);font-size:1.2rem;margin:1rem 0">Результат: ${score}/${questions.length}</p>
<button class="menu-btn btn-new" onclick="completeMinigame('${nextScene}',${Math.round(score/questions.length*100)})">Завершить ✓</button>`;
return;
}
const q=questions[qi];
cont.innerHTML=`<h3 style="color:var(--yellow);margin:1rem 0">${q.q}</h3>`;
q.opts.forEach((o,i)=>{
const btn=document.createElement('button');
btn.className='choice-btn';
btn.style.cssText='margin:5px 0';
btn.textContent=o;
btn.onclick=()=>{if(i===q.correct)score++;qi++;render();};
cont.appendChild(btn);
});
}
render();
}

function initConflictGame(nextScene){
const questions=[
{sit:'Соседи ссорятся из-за шума. Один недавно потерял работу.',cause:'Стресс и неравенство',excuse:'Громкая музыка',
opts_cause:['Стресс и неравенство','Громкая музыка','Плохая изоляция'],opts_excuse:['Громкая музыка','Стресс','Плохой характер']},
{sit:'Коллеги конфликтуют из-за проекта. Один чувствует, что его не ценят.',cause:'Неравное признание',excuse:'Спор о деталях',
opts_cause:['Неравное признание','Спор о деталях','Личная неприязнь'],opts_excuse:['Спор о деталях проекта','Неравное признание','Разные характеры']},
];
let qi=0,score=0;
function render(){
const cont=document.getElementById('conf-q');
if(qi>=questions.length){
cont.innerHTML=`<p style="color:var(--accent);font-size:1.2rem;margin:1rem 0">Результат: ${score}/${questions.length*2}</p>
<button class="menu-btn btn-new" onclick="completeMinigame('${nextScene}',${Math.round(score/(questions.length*2)*100)})">Завершить ✓</button>`;
return;
}
const q=questions[qi];
cont.innerHTML=`<p style="color:var(--coral);font-style:italic;margin:1rem 0">«${q.sit}»</p>
<h4 style="color:var(--purple);margin:.5rem 0">🔍 Причина:</h4>`;
q.opts_cause.forEach(o=>{
const btn=document.createElement('button');btn.className='choice-btn';btn.style.cssText='margin:3px 0;font-size:.9rem';btn.textContent=o;
btn.onclick=()=>{if(o===q.cause)score++;renderExcuse();};
cont.appendChild(btn);
});
}
function renderExcuse(){
const q=questions[qi];
const cont=document.getElementById('conf-q');
cont.innerHTML+=`<h4 style="color:var(--yellow);margin:.5rem 0">⚡ Повод:</h4>`;
q.opts_excuse.forEach(o=>{
const btn=document.createElement('button');btn.className='choice-btn';btn.style.cssText='margin:3px 0;font-size:.9rem';btn.textContent=o;
btn.onclick=()=>{if(o===q.excuse)score++;qi++;render();};
cont.appendChild(btn);
});
}
render();
}

const questions=[
{sit:'Рождение ребёнка, регистрация брака',correct:'Семья',opts:['Семья','Образование','Политика','Экономика']},

// ===== TEACHER MODE =====
function renderTeacher(){
const data=localStorage.getItem('socicum_teacher_data');
const students=data?JSON.parse(data):[];
const list=document.getElementById('teacher-list');
const stats=document.getElementById('teacher-stats');
if(!students.length){
stats.innerHTML='';
list.innerHTML='<p style="color:var(--dim);text-align:center;padding:2rem">Пока нет импортированных результатов</p>';
return;
}
const avg=students.reduce((s,st)=>s+st.grade,0)/students.length;
stats.innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1rem">
<div style="background:rgba(0,212,170,.1);padding:1rem;border-radius:12px;text-align:center"><div style="font-size:2rem;font-weight:800;color:var(--accent)">${students.length}</div><div style="font-size:.8rem;color:var(--dim)">Учеников</div></div>
<div style="background:rgba(255,215,0,.1);padding:1rem;border-radius:12px;text-align:center"><div style="font-size:2rem;font-weight:800;color:var(--yellow)">${avg.toFixed(1)}</div><div style="font-size:.8rem;color:var(--dim)">Средняя оценка</div></div>
<div style="background:rgba(74,222,128,.1);padding:1rem;border-radius:12px;text-align:center"><div style="font-size:2rem;font-weight:800;color:var(--green)">${students.filter(s=>s.progress.ending).length}</div><div style="font-size:.8rem;color:var(--dim)">Завершили</div></div>
</div>
<div style="margin-top:1rem;display:flex;gap:10px;flex-wrap:wrap">
<button class="nav-btn" onclick="exportTeacherReport()">📄 Отчёт TXT</button>
<button class="nav-btn" onclick="exportTeacherCSV()">📊 Экспорт CSV</button>
</div>`;
list.innerHTML=students.map(s=>`
<div class="teacher-student" onclick="viewStudent('${s.code}')">
<div style="display:flex;justify-content:space-between;align-items:center">
<div><strong style="color:var(--yellow);font-family:monospace">${s.code}</strong> · ${s.name}</div>
<div style="display:flex;gap:10px;align-items:center">
<span style="padding:4px 12px;border-radius:20px;font-weight:700;background:${s.grade>=4?'rgba(74,222,128,.2)':'rgba(255,107,107,.2)'};color:${s.grade>=4?'var(--green)':'var(--coral)'}">${s.grade}</span>
<span style="color:var(--dim);font-size:.85rem">${s.progress.sceneHistory.length} сцен</span>
</div>
</div>
</div>`).join('');
}

function importStudents(event){
const files=event.target.files;
if(!files)return;
const data=localStorage.getItem('socicum_teacher_data');
const students=data?JSON.parse(data):[];
Array.from(files).forEach(file=>{
const reader=new FileReader();
reader.onload=(e)=>{
try{
const d=JSON.parse(e.target.result);
if(!d.progress||!d.studentCode)return;
const grade=calcGrade(d.progress);
const existing=students.findIndex(s=>s.code===d.studentCode);
const student={code:d.studentCode,name:d.progress.name||'Неизвестный',grade,comment:'',progress:d.progress,importedAt:new Date().toISOString()};
if(existing>=0)students[existing]=student;
else students.push(student);
localStorage.setItem('socicum_teacher_data',JSON.stringify(students));
renderTeacher();
toast('✅ Импортировано: '+d.studentCode);
}catch(err){toast('❌ Ошибка: '+file.name);}
};
reader.readAsText(file);
});
event.target.value='';
}

function calcGrade(p){
let score=0,max=100;
score+=Math.min(30,(p.sceneHistory.length/30)*30);
if(p.minigameScores){
const scores=Object.values(p.minigameScores);
if(scores.length)score+=(scores.reduce((a,b)=>a+b,0)/scores.length/100)*25;
}
score+=Math.min(20,(p.achievements.length/10)*20);
if(p.ending){score+=10;if(['ascending','stable','bridge','architect'].includes(p.ending))score+=5;}
score+=Math.min(10,(p.journal.length/8)*10);
const pct=(score/max)*100;
if(pct>=90)return 5;if(pct>=75)return 4;if(pct>=60)return 3;if(pct>=40)return 2;return 1;
}

function viewStudent(code){
const data=JSON.parse(localStorage.getItem('socicum_teacher_data')||'[]');
const s=data.find(st=>st.code===code);
if(!s)return;
const mc=document.getElementById('modal-content');
mc.innerHTML=`<h2>👤 ${s.name}</h2>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
<div><div style="font-size:.8rem;color:var(--dim)">Код</div><div style="font-family:monospace;color:var(--yellow)">${s.code}</div></div>
<div><div style="font-size:.8rem;color:var(--dim)">Район</div><div>${s.progress.district||'—'}</div></div>
</div>
<div style="background:rgba(255,255,255,.05);padding:1rem;border-radius:12px;margin-bottom:1rem">
<h4 style="color:var(--accent);margin-bottom:.5rem">📊 Прогресс</h4>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;font-size:.85rem">
<div>Сцен: <strong>${s.progress.sceneHistory.length}</strong></div>
<div>Достижений: <strong>${s.progress.achievements.length}</strong></div>
<div>Статусов: <strong>${s.progress.achievedStatuses.length}</strong></div>
<div>Ролей: <strong>${s.progress.roles.length}</strong></div>
<div>Страта: <strong>${s.progress.strata}</strong></div>
<div>Финал: <strong>${s.progress.ending||'нет'}</strong></div>
</div>
</div>
<div style="margin-bottom:1rem">
<label style="display:block;color:var(--dim);margin-bottom:.5rem">Оценка (авто: ${s.grade})</label>
<div style="display:flex;gap:5px">
${[5,4,3,2,1].map(g=>`<button class="nav-btn" style="flex:1;${s.grade===g?'background:var(--accent);color:#0d0b2e':''}" onclick="setGrade('${code}',${g})">${g}</button>`).join('')}
</div>
</div>
<label style="display:block;color:var(--dim);margin-bottom:.5rem">Комментарий</label>
<textarea id="teacher-comment" style="width:100%;padding:10px;border-radius:8px;border:2px solid rgba(255,255,255,.1);background:var(--bg);color:var(--text);font-family:inherit;min-height:60px" placeholder="Комментарий...">${s.comment||''}</textarea>
<br><br>
<button class="menu-btn btn-new" onclick="saveStudentGrade('${code}')">💾 Сохранить</button>
<button class="menu-btn btn-settings" onclick="closeModal()">Закрыть</button>`;
document.getElementById('modal-overlay').classList.add('show');
}

function setGrade(code,grade){
const data=JSON.parse(localStorage.getItem('socicum_teacher_data')||'[]');
const s=data.find(st=>st.code===code);
if(s)s.grade=grade;
localStorage.setItem('socicum_teacher_data',JSON.stringify(data));
viewStudent(code);
}

function saveStudentGrade(code){
const data=JSON.parse(localStorage.getItem('socicum_teacher_data')||'[]');
const s=data.find(st=>st.code===code);
if(s){
s.comment=document.getElementById('teacher-comment').value;
localStorage.setItem('socicum_teacher_data',JSON.stringify(data));
}
closeModal();
renderTeacher();
toast('✅ Сохранено');
}

function exportTeacherReport(){
const data=JSON.parse(localStorage.getItem('socicum_teacher_data')||'[]');
if(!data.length){toast('❌ Нет данных');return;}
let r='ОТЧЁТ ПО ИГРЕ "СОЦИУМ"\n========================\n\n';
r+=`Дата: ${new Date().toLocaleDateString('ru-RU')}\nУчеников: ${data.length}\n`;
const avg=data.reduce((s,st)=>s+st.grade,0)/data.length;
r+=`Средняя оценка: ${avg.toFixed(2)}\n\n`;
data.forEach((s,i)=>{
r+=`${i+1}. ${s.name} (${s.code})\n   Оценка: ${s.grade}\n   Комментарий: ${s.comment||'—'}\n   Сцен: ${s.progress.sceneHistory.length}\n   Страта: ${s.progress.strata}\n   Финал: ${s.progress.ending||'—'}\n\n`;
});
const blob=new Blob([r],{type:'text/plain;charset=utf-8'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');a.href=url;a.download='СОЦИУМ_отчёт.txt';
document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
toast('📄 Отчёт скачан');
}

function exportTeacherCSV(){
const data=JSON.parse(localStorage.getItem('socicum_teacher_data')||'[]');
if(!data.length){toast('❌ Нет данных');return;}
const rows=[['Код','Имя','Оценка','Комментарий','Сцен','Страта','Финал']];
data.forEach(s=>rows.push([s.code,s.name,s.grade,s.comment||'',s.progress.sceneHistory.length,s.progress.strata,s.progress.ending||'']));
const csv='\uFEFF'+rows.map(r=>r.join(';')).join('\n');
const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');a.href=url;a.download='СОЦИУМ_результаты.csv';
document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
toast('📊 CSV скачан');
}
