<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>СОЦИУМ: жизнь в обществе</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f2e;--bg2:#1a1a4e;--card:#231f5c;--accent:#00d4aa;--yellow:#ffd93d;--coral:#ff6b6b;--purple:#a78bfa;--blue:#60a5fa;--green:#4ade80;--text:#e2e8f0;--dim:#94a3b8;--radius:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,var(--bg),var(--bg2),#2d1b4e);color:var(--text);min-height:100vh;overflow-x:hidden}
button{cursor:pointer;border:none;font-family:inherit}
.screen{display:none;min-height:100vh;padding:16px;animation:fadeIn .5s}
.screen.active{display:flex;flex-direction:column;align-items:center}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
.title{font-size:clamp(2rem,6vw,3.5rem);font-weight:900;text-align:center;background:linear-gradient(135deg,var(--accent),var(--yellow),var(--coral));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:20px 0;animation:pulse 3s infinite;font-family:Georgia,serif;letter-spacing:.05em}
.subtitle{font-size:clamp(1rem,3vw,1.3rem);color:var(--dim);text-align:center;margin-bottom:30px;letter-spacing:.15em;text-transform:uppercase;font-weight:300}
.menu-btn{display:block;width:min(320px,90%);padding:16px 24px;margin:10px auto;border-radius:var(--radius);font-size:1.05rem;font-weight:700;color:#fff;transition:all .3s;text-align:center;text-transform:uppercase;letter-spacing:.05em}
.menu-btn:hover{transform:translateY(-3px);box-shadow:0 8px 25px rgba(0,0,0,.3)}
.btn-new{background:linear-gradient(135deg,#059669,#00d4aa)}
.btn-cont{background:linear-gradient(135deg,#2563eb,#60a5fa)}
.btn-rules{background:linear-gradient(135deg,#7c3aed,#a78bfa)}
.btn-gloss{background:linear-gradient(135deg,#d97706,#ffd93d);color:#1a1a2e}
.btn-settings{background:linear-gradient(135deg,#dc2626,#ff6b6b)}
.btn-teacher{background:linear-gradient(135deg,#8b5cf6,#6366f1)}
.btn-download{background:linear-gradient(135deg,#10b981,#059669)}
.hud{position:sticky;top:0;z-index:100;width:100%;max-width:800px;background:rgba(13,11,46,.95);backdrop-filter:blur(10px);border-radius:0 0 var(--radius) var(--radius);padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.res-bar{flex:1;min-width:80px;max-width:160px}
.res-label{font-size:.65rem;color:var(--dim);display:flex;justify-content:space-between;font-weight:600}
.res-label span:last-child{color:var(--accent);font-weight:700}
.res-track{height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;margin-top:2px}
.res-fill{height:100%;border-radius:4px;transition:width .8s}
.game-area{width:100%;max-width:800px;flex:1;display:flex;flex-direction:column;align-items:center;padding:16px 0}
.scene-img{width:100%;max-width:500px;margin:10px 0;border-radius:var(--radius);overflow:hidden;animation:float 4s ease-in-out infinite;position:relative}
.scene-img::before{content:'';position:absolute;inset:-3px;background:linear-gradient(45deg,var(--accent),var(--purple),var(--yellow),var(--coral));border-radius:19px;z-index:-1;opacity:.6;animation:shimmer 3s linear infinite;background-size:200% 100%}
.scene-img svg{width:100%;height:auto;display:block}
.scene-text{background:var(--card);border-radius:var(--radius);padding:20px;width:100%;max-width:700px;line-height:1.8;font-size:clamp(.95rem,2.5vw,1.1rem);margin:10px 0;animation:fadeIn .4s}
.scene-text::first-letter{font-size:1.3em;font-weight:700;color:var(--accent);float:left;margin-right:.1em}
.scene-title{font-size:clamp(1.8rem,4.5vw,2.5rem);font-weight:900;background:linear-gradient(135deg,var(--yellow),var(--coral),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.75rem;font-family:Georgia,serif;text-align:center;line-height:1.2}
.scene-act{font-size:.85rem;color:var(--accent);margin-bottom:1rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.concept-note{padding:1.5rem;background:linear-gradient(135deg,rgba(0,212,170,.15),rgba(155,89,182,.1));border:2px solid rgba(0,212,170,.4);border-radius:18px;margin:10px 0;font-size:1rem;font-weight:600;color:var(--accent);max-width:700px;width:100%;position:relative}
.concept-note::after{content:'💡';position:absolute;top:1rem;right:1rem;font-size:1.5rem;animation:float 2s infinite}
.choices{width:100%;max-width:700px;display:flex;flex-direction:column;gap:8px;margin:10px 0}
.choice-btn{background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:2px solid rgba(255,255,255,.12);border-radius:16px;padding:1.2rem 1.5rem;color:var(--text);font-size:1.05rem;font-weight:500;text-align:left;transition:all .4s;line-height:1.6}
.choice-btn:hover{background:linear-gradient(135deg,rgba(0,212,170,.15),rgba(155,89,182,.1));border-color:var(--accent);transform:translateX(8px) scale(1.02);box-shadow:0 8px 24px rgba(0,212,170,.2);color:var(--accent)}
.status-badge{display:inline-block;padding:6px 14px;border-radius:20px;font-size:.8rem;font-weight:700;margin:3px;transition:all .3s}
.badge-blue{background:rgba(96,165,250,.2);color:var(--blue);border:2px solid var(--blue)}
.badge-purple{background:rgba(167,139,250,.2);color:var(--purple);border:2px solid var(--purple)}
.badge-green{background:rgba(74,222,128,.2);color:var(--green);border:2px solid var(--green)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(13,11,46,.95);backdrop-filter:blur(15px);padding:10px 16px;display:flex;justify-content:center;gap:10px;z-index:100;border-top:2px solid rgba(0,212,170,.2);flex-wrap:wrap}
.nav-btn{padding:8px 16px;border-radius:20px;font-size:.8rem;font-weight:700;color:var(--dim);background:var(--card);transition:all .3s;text-transform:uppercase;letter-spacing:.03em}
.nav-btn:hover{color:var(--accent);background:rgba(0,212,170,.1)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(5px);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:linear-gradient(135deg,var(--bg2),#2d1b4e);border:3px solid rgba(0,212,170,.3);border-radius:28px;padding:2.5rem;max-width:600px;width:100%;max-height:85vh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:12px;right:12px;background:var(--coral);color:#fff;border-radius:50%;width:32px;height:32px;font-size:1.2rem;display:flex;align-items:center;justify-content:center;z-index:10}
.modal h2{font-size:2rem;font-weight:900;background:linear-gradient(135deg,var(--yellow),var(--coral));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:1.5rem;font-family:Georgia,serif}
.create-form{width:100%;max-width:500px;background:var(--card);border-radius:var(--radius);padding:24px;border:2px solid rgba(255,255,255,.1)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.95rem;color:var(--accent);margin-bottom:6px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.form-group input,.form-group select{width:100%;padding:12px;border-radius:12px;border:2px solid rgba(255,255,255,.15);background:var(--bg);color:var(--text);font-size:1.05rem;font-weight:500}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 20px rgba(0,212,170,.2)}
.form-group select option{background:var(--bg2);color:var(--text)}
.minigame-area{width:100%;max-width:700px;background:var(--card);border-radius:var(--radius);padding:20px;margin:10px 0}
.passport{background:var(--card);border-radius:var(--radius);padding:24px;width:100%;max-width:700px;margin:10px 0;border:3px solid rgba(255,215,0,.3)}
.passport h2{text-align:center;color:var(--yellow);margin-bottom:16px;font-family:Georgia,serif}
.passport-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--accent);color:#0d0b2e;padding:12px 24px;border-radius:var(--radius);font-weight:700;z-index:300;animation:toastAnim 3s forwards}
@keyframes toastAnim{0%{opacity:0;transform:translateX(-50%) translateY(-20px)}10%{opacity:1;transform:translateX(-50%) translateY(0)}90%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-20px)}}
.glossary-item{padding:1.25rem;margin-bottom:.85rem;border-radius:14px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);transition:all .3s}
.glossary-item:hover{border-color:var(--yellow);transform:translateY(-3px)}
.glossary-term{font-weight:800;font-size:1.15rem;background:linear-gradient(135deg,var(--yellow),var(--coral));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.5rem;font-family:Georgia,serif}
.glossary-def{font-size:.95rem;color:var(--text);line-height:1.7}
.teacher-student{padding:1rem;background:rgba(255,255,255,.05);border-radius:12px;margin:.5rem 0;cursor:pointer;transition:all .3s;border:2px solid transparent}
.teacher-student:hover{border-color:var(--accent);transform:translateX(5px)}
.ending-title{font-size:clamp(2.5rem,6vw,4rem);font-weight:900;background:linear-gradient(135deg,var(--accent),var(--yellow),var(--coral),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:2rem;font-family:Georgia,serif;text-align:center;animation:float 3s infinite}
.ending-text{font-size:clamp(1.15rem,2.8vw,1.4rem);line-height:1.9;max-width:650px;margin-bottom:2.5rem;text-align:justify}
@media(max-width:600px){.hud{gap:4px}.res-bar{min-width:60px}}
</style>
</head>
<body>
<div id="screen-start" class="screen active">
<div id="start-logo"></div>
<h1 class="title">СОЦИУМ</h1>
<p class="subtitle">Жизнь в обществе · §5 · 10 класс</p>
<button class="menu-btn btn-new" onclick="showScreen('create')">🎮 Новая игра</button>
<button class="menu-btn btn-cont" onclick="loadGame()">📂 Продолжить</button>
<button class="menu-btn btn-rules" onclick="openModal('rules')">📖 Правила игры</button>
<button class="menu-btn btn-gloss" onclick="openModal('glossary')">📚 Глоссарий</button>
<button class="menu-btn btn-teacher" onclick="showScreen('teacher')">👨‍🏫 Режим учителя</button>
</div>
<div id="screen-create" class="screen">
<h2 class="title" style="font-size:2rem">Создание персонажа</h2>
<div class="create-form">
<div class="form-group"><label>Имя</label><input id="inp-name" placeholder="Введите имя..." maxlength="20"></div>
<div class="form-group"><label>Пол</label><select id="inp-sex"><option value="male">Мужской</option><option value="female">Женский</option></select></div>
<div class="form-group"><label>Район города Социум</label><select id="inp-district"><option>Рабочий район</option><option>Спальный район</option><option>Центр</option><option>Приморский район</option></select></div>
<div class="form-group"><label>Тип семьи</label><select id="inp-family"><option>Рабочая семья</option><option>Семья учителей/врачей</option><option>Семья предпринимателей</option><option>Неполная семья</option><option>Семья мигрантов</option></select></div>
<button class="menu-btn btn-new" onclick="startGame()" style="margin-top:20px">Начать жизнь →</button>
<button class="menu-btn btn-settings" onclick="showScreen('start')">← Назад</button>
</div>
</div>
<div id="screen-game" class="screen">
<div class="hud" id="hud"></div>
<div class="game-area" id="game-area"></div>
<div class="bottom-nav">
<button class="nav-btn" onclick="openModal('journal')">📓 Журнал</button>
<button class="nav-btn" onclick="openModal('statuses')">👤 Статусы</button>
<button class="nav-btn" onclick="openModal('glossary')">📚 Глоссарий</button>
<button class="nav-btn" onclick="saveGame()">💾 Сохранить</button>
<button class="nav-btn" onclick="exportProgress()" style="background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff">📤 Для учителя</button>
</div>
</div>
<div id="screen-teacher" class="screen">
<h2 class="title" style="font-size:2rem">👨‍🏫 Режим учителя</h2>
<div style="width:100%;max-width:800px">
<div style="background:rgba(255,255,255,.05);border-radius:16px;padding:1.5rem;margin-bottom:2rem;border:2px solid rgba(255,255,255,.1)">
<h3 style="color:var(--accent);margin-bottom:1rem">📥 Импорт результатов учеников</h3>
<p style="color:var(--dim);margin-bottom:1rem;font-size:.9rem">Загрузите JSON-файлы, которые экспортировали ученики</p>
<label class="menu-btn btn-new" style="cursor:pointer;display:inline-block;margin:0">Выбрать файлы<input type="file" accept=".json" multiple onchange="importStudents(event)" style="display:none"></label>
<div id="teacher-stats" style="margin-top:1rem"></div>
<div id="teacher-list" style="margin-top:1rem"></div>
</div>
<button class="menu-btn btn-settings" onclick="showScreen('start')">← Назад в меню</button>
</div>
</div>
<div id="screen-ending" class="screen"><div id="ending-content"></div></div>
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
<div class="modal" onclick="event.stopPropagation()">
<button class="modal-close" onclick="closeModal()">✕</button>
<div id="modal-content"></div>
</div>
</div>

const GLOSSARY={'Общество как система':'Общество — сложная система взаимосвязанных элементов: людей, групп, институтов, норм и ценностей.','Сферы общественной жизни':'Четыре основные сферы: экономическая, социальная, политическая, духовная.','Социальный институт':'Устойчивая форма организации совместной деятельности (семья, образование, государство).','Социальная структура':'Внутреннее устройство общества, совокупность социальных групп и связей.','Социальная стратификация':'Деление общества на слои (страты) по критериям: доход, образование, власть, престиж.','Социальный статус':'Положение человека в обществе, определяющее его права и обязанности.','Предписанный статус':'Статус, данный от рождения (пол, возраст, национальность).','Достигаемый статус':'Статус, приобретённый благодаря личным усилиям (профессия, образование).','Статусный набор':'Совокупность всех статусов, которые имеет человек одновременно.','Социальная роль':'Модель поведения, ожидаемая от человека с определённым статусом.','Социальная мобильность':'Перемещение человека или группы в социальной структуре общества.','Социальный лифт':'Каналы вертикальной мобильности: образование, брак, карьера, бизнес.','Социальный конфликт':'Столкновение противоположных интересов, целей, взглядов.','Причина конфликта':'Глубинное противоречие, порождающее конфликт.','Повод конфликта':'Формальный предлог, событие, запускающее конфликт.'};
const SCENES=[{id:'a1_s1',act:1,title:'Первый день в новой школе',img:'school',text:'Тебе 14 лет. Ты перешёл в новую школу в городе Социум. Утро начинается с волнения — новый класс, новые лица, новые правила. Коридор шумит: кто-то смеётся, кто-то спорит, группы друзей уже сформировались за лето. Ты стоишь у двери класса 9 «Б». Учительница представляет тебя: «Ребята, это наш новый ученик». Тридцать пар глаз поворачиваются к тебе. Как ты войдёшь в это новое сообщество?',choices:[{text:'Уверенно представлюсь и займу место за первой партой',next:'a1_s2a',effects:{prestige:5,reputation:5},addJournal:'Социальный статус',addRole:'ученик'},{text:'Тихо сяду за последнюю парту и буду наблюдать',next:'a1_s2b',effects:{innerStability:5,socialConnections:-5},addRole:'ученик'},{text:'Попробую пошутить, чтобы расположить к себе класс',next:'a1_s2c',effects:{socialConnections:10,reputation:3},addRole:'ученик'}],conceptNote:'Школа — это социальный институт. Ты входишь в новое сообщество, где уже есть свои роли и статусы.'},{id:'a1_s2a',act:1,title:'Уверенное начало',img:'school',text:'Ты уверенно называешь имя и садишься впереди. Девочка рядом шепчет: «Смелый». Но ты замечаешь: у класса уже есть неформальный лидер — Дима, он сидит в центре, все к нему прислушиваются.',choices:[{text:'Подойти к Диме на перемене и попробовать подружиться',next:'a1_s3',effects:{socialConnections:10,prestige:3},flags:{leaderFriend:true}},{text:'Показать, что я не хуже',next:'a1_s3',effects:{prestige:5,reputation:-3},flags:{leaderRival:true}},{text:'Сосредоточиться на учёбе',next:'a1_s3',effects:{education:10,socialConnections:-5},addStatus:'хорошист'}]},{id:'a1_s2b',act:1,title:'Тихий наблюдатель',img:'school',text:'Ты садишься у окна. Отсюда видно всё. К тебе подходит застенчивый парень Артём: «Ты тоже новенький? Пойдём, покажу столовую».',choices:[{text:'Пойти с Артёмом',next:'a1_s3',effects:{socialConnections:8,familyWellbeing:3},addRole:'друг',flags:{quietFriend:true}},{text:'Остаться одному',next:'a1_s3',effects:{innerStability:5,socialConnections:-5},flags:{loner:true}}]},{id:'a1_s2c',act:1,title:'Шутник',img:'school',text:'Твоя шутка вызывает смех — но не у всех. Учительница хмурится: «Мы тут учимся». Дима ухмыляется: «Клоун нашёлся». Зато несколько человек подошли на перемене.',choices:[{text:'Продолжить быть душой компании',next:'a1_s3',effects:{socialConnections:12,reputation:-5,prestige:-3},addRole:'душа компании'},{text:'Показать, что я ещё и учиться могу',next:'a1_s3',effects:{education:5,reputation:5,socialConnections:5},addStatus:'разносторонний'}]},{id:'a1_s3',act:1,title:'Групповой проект',img:'school',text:'Учительница задаёт групповой проект. В твою группу попадают: Дима (лидер), Маша (отличница) и Кирилл (вечно опаздывает). Дима сразу говорит: «Я решаю, кто что делает. Маша — текст, Кирилл — оформление, новенький — презентация». Маша опускает глаза.',choices:[{text:'Согласиться — не стоит портить отношения',next:'a1_s4',effects:{innerStability:-10,reputation:3},addConflict:'unequal_roles'},{text:'Предложить распределить роли по справедливости',next:'a1_s4',effects:{prestige:8,socialConnections:5},flags:{fairDistrib:true},addConflict:'unequal_roles'},{text:'Отказаться и потребовать другую группу',next:'a1_s4',effects:{prestige:-5,reputation:-8,innerStability:5},flags:{refusedGroup:true},addConflict:'unequal_roles'}],conceptNote:'В группе распределяются роли. Когда роли навязаны несправедливо — возникает конфликт.'},{id:'a1_s4',act:1,title:'Встреча с классным руководителем',img:'school',text:'Классная руководительница Ирина Петровна вызывает тебя: «Как тебе у нас? Помни: в классе, как в обществе, каждый выполняет свою роль».',choices:[{text:'«Мне нравится, но в группе был несправедливый раздел задач»',next:'a1_s5',effects:{education:5,prestige:5},addJournal:'Социальная роль',flags:{talkedTeacher:true}},{text:'«Всё нормально, справлюсь»',next:'a1_s5',effects:{innerStability:5},addJournal:'Ролевые ожидания'},{text:'«А что вы имеете в виду под ролями?»',next:'a1_s5',effects:{education:10},addJournal:'Социальная роль'}]},{id:'a1_s5',act:1,title:'Семейный совет',img:'family',text:'Вечером за ужином семья обсуждает твоё будущее. «Через два года — выпускной. Куда дальше?» Папа — в бизнес. Мама — в университет. Бабушка — «хоть кем-то стать».',choices:[{text:'«Я хочу в университет»',next:'a1_s6',effects:{education:10,familyWellbeing:5},flags:{uniPath:true},addJournal:'Социальный лифт'},{text:'«Может, колледж? Быстрее начну зарабатывать»',next:'a1_s6',effects:{income:5,education:5},flags:{collegePath:true}},{text:'«Я пока не знаю»',next:'a1_s6',effects:{innerStability:5,familyWellbeing:-5},flags:{undecided:true}}]},{id:'a1_s6',act:1,title:'Распределение ролей в классе',img:'school',text:'Проходит месяц. В классе сложились чёткие роли. Дима — лидер, Маша — «ботаник», Кирилл — «клоун», Артём — «тихоня». А какая роль досталась тебе?',choices:[{text:'Принять свою роль',next:'a1_s7',effects:{innerStability:10,prestige:3},addStatus:'принятый'},{text:'Попытаться сменить роль',next:'a1_s7',effects:{prestige:8,reputation:5,innerStability:-5},addStatus:'амбициозный'},{text:'Быть собой',next:'a1_s7',effects:{innerStability:5,socialConnections:-5,reputation:3},addStatus:'независимый'}]},{id:'a1_s7',act:1,title:'Конфликт: причина и повод',img:'conflict',text:'В классе назревает конфликт. Кирилл опоздал на встречу группы. Дима взорвался: «Ты вечно опаздываешь! Ты безответственный!» Но ты знаешь: Кирилл подрабатывает после школы, чтобы помогать семье. Повод — опоздание. А что — причина?',choices:[{text:'Реагировать на повод: «Да, Кирилл, надо приходить вовремя»',next:'a1_s8',effects:{prestige:3,socialConnections:-5}},{text:'Понять причину: «Кирилл работает, давайте перенесём встречи»',next:'a1_s8',effects:{socialConnections:10,reputation:8,innerStability:5},flags:{understoodCause:true},addJournal:'Причина конфликта'},{text:'Не вмешиваться',next:'a1_s8',effects:{innerStability:5,socialConnections:-3}}],conceptNote:'Повод — формальный триггер конфликта. Причина — глубинное противоречие.'},{id:'a1_s8',act:1,title:'Мини-игра: Паутина общества',img:'network',text:'Ирина Петровна проводит урок-игру: «Представьте общество как паутину. Соедините элементы».',choices:[{text:'🎮 Начать мини-игру',next:'a1_s9',minigame:'web'}]},{id:'a1_s9',act:1,title:'Итоги первого акта',img:'city',text:'Первый год в новой школе позади. Ты многое понял о том, как устроено школьное сообщество — маленькая модель общества. Впереди — выбор пути. Тебе уже 17 лет.',choices:[{text:'Продолжить →',next:'a2_s1',effects:{education:5}}]},{id:'a2_s1',act:2,title:'Выбор пути',img:'city',text:'Тебе 17 лет. Школа заканчивается. Перед тобой — несколько дорог. Каждая ведёт в свой слой общества, даёт свой статус и набор ролей. Что выберешь?',choices:[{text:'Университет — высшее образование',next:'a2_s2_uni',effects:{education:15,income:-10},flags:{pathUni:true},addStatus:'абитуриент',addLift:'Образование'},{text:'Колледж — быстрее в профессию',next:'a2_s2_col',effects:{education:10,income:5},flags:{pathCollege:true},addStatus:'студент колледжа'},{text:'Сразу работать',next:'a2_s2_work',effects:{income:10,education:-5,power:5},flags:{pathWork:true},addStatus:'работник'},{text:'Волонтёрство и активизм',next:'a2_s2_vol',effects:{socialConnections:15,reputation:10,income:-5},flags:{pathVolunteer:true},addStatus:'волонтёр',addRole:'активист'}],conceptNote:'Образование, работа, активизм — это каналы социальной мобильности, «социальные лифты».'},{id:'a2_s2_uni',act:2,title:'Университет',img:'work',text:'Ты поступаешь в университет. Новый коллектив, новые статусы. Но учёба дорогая, и приходится подрабатывать.',choices:[{text:'Сосредоточиться на учёбе',next:'a2_s3',effects:{education:15,income:-5,innerStability:-5}},{text:'Балансировать между учёбой и работой',next:'a2_s3',effects:{education:8,income:5,innerStability:-10},addRole:'работник'}]},{id:'a2_s2_col',act:2,title:'Колледж',img:'work',text:'Колледж даёт практические навыки быстрее. Но однокурсники из университета смотрят свысока.',choices:[{text:'Доказать делом',next:'a2_s3',effects:{prestige:10,education:10,income:10},addStatus:'специалист'},{text:'Принять свой путь',next:'a2_s3',effects:{innerStability:10,prestige:3}}]},{id:'a2_s2_work',act:2,title:'Первая работа',img:'work',text:'Ты устраиваешься на работу. Коллектив — новая социальная группа. Здесь есть свой лидер, свои неформальные правила.',choices:[{text:'Стать незаменимым специалистом',next:'a2_s3',effects:{income:10,prestige:8,education:5},addStatus:'специалист'},{text:'Продвигаться по карьерной лестнице',next:'a2_s3',effects:{power:10,prestige:5,socialConnections:5,innerStability:-5}}]},{id:'a2_s2_vol',act:2,title:'Волонтёрство',img:'city',text:'Ты присоединяешься к волонтёрскому движению. Помогаешь людям, участвуешь в акциях. Твои социальные связи растут, но доход минимальный.',choices:[{text:'Продолжать — это моё призвание',next:'a2_s3',effects:{socialConnections:15,reputation:15,income:-10},addStatus:'активист'},{text:'Совмещать с работой',next:'a2_s3',effects:{socialConnections:10,income:5,innerStability:-10},addRole:'работник'}]},{id:'a2_s3',act:2,title:'Переезд',img:'migration',text:'Жизнь предлагает переезд. Работа/учёба в другом районе или городе. Это меняет окружение, но не обязательно статус.',choices:[{text:'Переехать — новые возможности',next:'a2_s4',effects:{socialConnections:-5,income:10,prestige:5},addMobility:'Географическая мобильность',flags:{moved:true}},{text:'Остаться — здесь мои связи',next:'a2_s4',effects:{socialConnections:10,innerStability:5}}],conceptNote:'Переезд — географическая мобильность. Статус может сохраниться, но окружение меняется.'},{id:'a2_s4',act:2,title:'Личная жизнь',img:'family',text:'Тебе 22 года. Ты встречаешь человека, с которым хочется строить жизнь вместе. Брак — новый статус, новые роли.',choices:[{text:'Создать семью',next:'a2_s5',effects:{familyWellbeing:20,socialConnections:10,income:-5},addStatus:'супруг(а)',addRole:'супруг(а)',addLift:'Брак ебя в присвоении его идей. На самом деле вы работали вместе, но он считает, что его вклад не оценили.',choices:[{text:'Поговорить с коллегой наедине',next:'a3_s3',effects:{socialConnections:5,reputation:8},flags:{conflictNegotiation:true}},{text:'Обратиться к руководству',next:'a3_s3',effects:{power:5,reputation:-3,socialConnections:-5}},{text:'Игнорировать',next:'a3_s3',effects:{innerStability:-10,reputation:-5}}]},{id:'a3_s3',act:3,title:'Соседский конфликт',img:'conflict',text:'Дома — новая проблема. Сосед сверху громко включает музыку по ночам. Повод — шум. Но когда ты поднимаешься, видишь: сосед — одинокий мужчина, недавно потерявший работу.',choices:[{text:'Поговорить по-человечески',next:'a3_s4',effects:{socialConnections:8,reputation:10,innerStability:5},flags:{neighborPeace:true}},{text:'Написать жалобу',next:'a3_s4',effects:{power:3,socialConnections:-5,reputation:-3}},{text:'Предложить компромисс',next:'a3_s4',effects:{socialConnections:5,reputation:5},flags:{neighborCompromise:true}}]},{id:'a3_s4',act:3,title:'Мини-игра: Конфликтный узел',img:'conflict',text:'Тебя приглашают как медиатора в сложный конфликт. Нужно отделить причину от повода.',choices:[{text:'🎮 Начать мини-игру',next:'a3_s5',minigame:'conflict'}]},{id:'a3_s5',act:3,title:'Участие в самоуправлении',img:'city',text:'Жители твоего дома создают совет. Обсуждают: ремонт подъезда, парковка, детская площадка.',choices:[{text:'Возглавить инициативную группу',next:'a3_s6',effects:{power:15,prestige:10,socialConnections:15},addStatus:'местный активист',addRole:'лидер'},{text:'Активно участвовать',next:'a3_s6',effects:{socialConnections:10,reputation:8},addRole:'гражданин'},{text:'Это не моё дело',next:'a3_s6',effects:{innerStability:5,socialConnections:-5}}]},{id:'a3_s6',act:3,title:'Экономический кризис',img:'conflict',text:'В стране — экономический кризис. Цены растут, зарплаты падают. Это структурная мобильность: общество меняется.',choices:[{text:'Адаптироваться',next:'a3_s7',effects:{income:-10,education:10},addMobility:'Структурная мобильность'},{text:'Помогать другим',next:'a3_s7',effects:{socialConnections:15,reputation:15,income:-15}}]},{id:'a3_s7',act:3,title:'Мини-игра: Институциональный пазл',img:'network',text:'Финальное испытание. Распредели ситуации по социальным институтам.',choices:[{text:'🎮 Начать мини-игру',next:'a3_s8',minigame:'institutions'}]},{id:'a3_s8',act:3,title:'Выбор между выгодой и пользой',img:'negotiations',text:'Перед тобой моральный выбор. Ты можешь получить большую выгоду, но это навредит другим. Или поступить по совести.',choices:[{text:'Выбрать общественную пользу',next:'a3_s9',effects:{reputation:20,socialConnections:15,income:-15},flags:{moralChoice:'good'}},{text:'Выбрать личную выгоду',next:'a3_s9',effects:{income:20,power:15,reputation:-15},flags:{moralChoice:'self'}},{text:'Найти решение, которое поможет всем',next:'a3_s9',effects:{reputation:10,income:5,socialConnections:10,power:5},flags:{moralChoice:'balance'}}]},{id:'a3_s9',act:3,title:'Итоги жизни',img:'passport',text:'Тебе 32 года. Ты прожил почти два десятилетия в городе Социум. Теперь — время подвести итоги.',choices:[{text:'Посмотреть итоговый паспорт →',next:'ending',effects:{}}]}];
let S=null;const SAVE_KEY='socicum_save_v2';
function defaultState(){return{name:'',sex:'male',age:14,district:'',family:'',resources:{income:30,education:20,prestige:25,power:10,socialConnections:20,familyWellbeing:50,innerStability:60,reputation:30},statuses:['подросток','житель Социума'],achievedStatuses:[],roles:['ученик','ребёнок в семье'],flags:{},achievements:[],journal:[],conflicts:[],mobilityEvents:[],socialLifts:[],strata:'Начальное положение',currentScene:'a1_s1',sceneHistory:[],ending:null,studentCode:'',minigameScores:{}}}
const DB={'Рабочий район':{income:-10,prestige:-5,innerStability:10,socialConnections:10},'Спальный район':{income:0,education:5,familyWellbeing:10,innerStability:5},'Центр':{income:10,prestige:10,education:5,socialConnections:5},'Приморский район':{income:5,innerStability:15,socialConnections:5,reputation:5}};
const FB={'Рабочая семья':{income:-5,socialConnections:15,innerStability:5,prestige:-5},'Семья учителей/врачей':{education:15,prestige:10,income:5,reputation:10},'Семья предпринимателей':{income:20,power:10,prestige:10,socialConnections:5},'Неполная семья':{innerStability:-10,familyWellbeing:-10,reputation:5,power:5},'Семья мигрантов':{socialConnections:-5,innerStability:10,reputation:5,income:-10}};
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-'+id).classList.add('active');if(id==='teacher')renderTeacher()}
function openModal(type){const mc=document.getElementById('modal-content');if(type==='rules'){mc.innerHTML='<h2>📖 Правила игры</h2><div style="font-size:.9rem;line-height:1.7;color:var(--dim)"><p><strong>СОЦИУМ</strong> — сюжетная обучающая игра по обществознанию §5.</p><br><p><strong>Как играть:</strong></p><ul style="padding-left:1.5rem;margin:.5rem 0"><li>Создай персонажа</li><li>Читай сцены и делай выбор</li><li>Каждый выбор влияет на ресурсы</li><li>Проходи мини-игры</li><li>В конце получи «Социологический паспорт»</li></ul><br><p><strong>Продолжительность:</strong> 20–30 минут</p></div><br><button class="menu-btn btn-new" onclick="closeModal()">Понятно!</button>'}else if(type==='glossary'){let h='<h2>📚 Глоссарий</h2>';for(const[t,d]of Object.entries(GLOSSARY))h+='<div class="glossary-item"><div class="glossary-term">'+t+'</div><div class="glossary-def">'+d+'</div></div>';mc.innerHTML=h}else if(type==='journal'){let h='<h2>📓 Журнал событий</h2>';if(!S.journal.length)h+='<p style="color:var(--dim)">Журнал пока пуст.</p>';else S.journal.forEach(i=>{h+='<div class="glossary-item"><div class="glossary-term">'+i+'</div>';if(GLOSSARY[i])h+='<div class="glossary-def">'+GLOSSARY[i]+'</div>';h+='</div>'});mc.innerHTML=h}else if(type==='statuses'){let h='<h2>👤 Статусы и роли</h2><h3 style="color:var(--blue);margin:1rem 0 .5rem">📌 Предписанные статусы</h3>';S.statuses.forEach(s=>h+='<span class="status-badge badge-blue">'+s+'</span>');h+='<h3 style="color:var(--purple);margin:1rem 0 .5rem">🎯 Достигаемые статусы</h3>';if(!S.achievedStatuses.length)h+='<p style="color:var(--dim)">Пока нет</p>';else S.achievedStatuses.forEach(s=>h+='<span class="status-badge badge-purple">'+s+'</span>');h+='<h3 style="color:var(--green);margin:1rem 0 .5rem">🎭 Роли</h3>';S.roles.forEach(r=>h+='<span class="status-badge badge-green">'+r+'</span>');mc.innerHTML=h}document.getElementById('modal-overlay').classList.add('show')}
function closeModal(e){if(e&&e.target!==e.currentTarget)return;document.getElementById('modal-overlay').classList.remove('show')}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}
function genCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let r='SOC-';for(let i=0;i<6;i++)r+=c[Math.floor(Math.random()*c.length)];return r}
function saveGame(){if(!S)return;localStorage.setItem(SAVE_KEY,JSON.stringify(S));toast('💾 Игра сохранена!')}
function loadGame(){const d=localStorage.getItem(SAVE_KEY);if(!d){toast('❌ Нет сохранений');return}try{S=JSON.parse(d);showScreen('game');renderScene()}catch(e){toast('❌ Ошибка загрузки')}}
function exportProgress(){if(!S){toast('❌ Нет данных');return}const d={version:'2.0',exportedAt:new Date().toISOString(),studentCode:S.studentCode,progress:S};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='СОЦИУМ_'+S.studentCode+'_'+S.name+'.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);toast('📤 Файл экспортирован!')}
function startGame(){const n=document.getElementById('inp-name').value.trim();if(!n){toast('❌ Введите имя');return}S=defaultState();S.name=n;S.sex=document.getElementById('inp-sex').value;S.district=document.getElementById('inp-district').value;S.family=document.getElementById('inp-family').value;S.studentCode=genCode();const db=DB[S.district]||{},fb=FB[S.family]||{};for(const[k,v]of Object.entries(db))S.resources[k]=Math.max(0,Math.min(100,S.resources[k]+v));for(const[k,v]of Object.entries(fb))S.resources[k]=Math.max(0,Math.min(100,S.resources[k]+v));showScreen('game');renderScene()}
function renderHUD(){const h=document.getElementById('hud');const r=[['income','💰 Доход'],['education','📚 Образование'],['prestige','⭐ Престиж'],['power','👑 Власть'],['socialConnections','🤝 Связи'],['familyWellbeing','🏠 Семья'],['innerStability','🧘 Устойчивость'],['reputation','📣 Репутация']];const c={income:'#4ade80',education:'#60a5fa',prestige:'#ffd93d',power:'#ff6b6b',socialConnections:'#a78bfa',familyWellbeing:'#f472b6',innerStability:'#00d4aa',reputation:'#fb923c'};h.innerHTML=r.map(([k,l])=>'<div class="res-bar"><div class="res-label"><span>'+l+'</span><span>'+S.resources[k]+'</span></div><div class="res-track"><div class="res-fill" style="width:'+S.resources[k]+'%;background:'+c[k]+'"></div></div></div>').join('')}
function renderScene(){if(!S)return;const sc=SCENES.find(s=>s.id===S.currentScene);if(!sc){showEnding();return}renderHUD();const a=document.getElementById('game-area');const am={1:14,2:17+Math.floor(S.sceneHistory.length%7),3:25+Math.floor(S.sceneHistory.length%7)};let h='<div class="scene-act">Акт '+sc.act+' · Возраст: '+(am[sc.act]||14)+' лет · Код: '+S.studentCode+'</div>';h+='<h2 class="scene-title">'+sc.title+'</h2>';if(sc.img&&SVGS[sc.img])h+='<div class="scene-img">'+SVGS[sc.img]+'</div>';h+='<div class="scene-text">'+sc.text+'</div>';if(sc.conceptNote)h+='<div class="concept-note">'+sc.conceptNote+'</div>';h+='<div class="choices">';sc.choices.forEach((c,i)=>{h+='<button class="choice-btn" onclick="makeChoice('+i+')">'+c.text+'</button>'});h+='</div>';a.innerHTML=h}
function makeChoice(i){const sc=SCENES.find(s=>s.id===S.currentScene);const c=sc.choices[i];if(c.effects)for(const[k,v]of Object.entries(c.effects))S.resources[k]=Math.max(0,Math.min(100,S.resources[k]+v));if(c.flags)Object.assign(S.flags,c.flags);if(c.addStatus&&!S.achievedStatuses.includes(c.addStatus))S.achievedStatuses.push(c.addStatus);if(c.addRole&&!S.roles.includes(c.addRole))S.roles.push(c.addRole);if(c.addJournal&&!S.journal.includes(c.addJournal))S.journal.push(c.addJournal);if(c.addConflict)S.conflicts.push(c.addConflict);if(c.addMobility&&!S.mobilityEvents.includes(c.addMobility))S.mobilityEvents.push(c.addMobility);if(c.addLift&&!S.socialLifts.includes(c.addLift))S.socialLifts.push(c.addLift);S.sceneHistory.push(S.currentScene);const avg=(S.resources.income+S.resources.education+S.resources.prestige+S.resources.power)/4;if(avg>65)S.strata='Высший слой';else if(avg>50)S.strata='Средний слой';else if(avg>35)S.strata='Ниже среднего';else S.strata='Низший слой';if(c.minigame)startMinigame(c.minigame,c.next);else if(c.next==='ending')showEnding();else{S.currentScene=c.next;renderScene();window.scrollTo(0,0)}}
function showEnding(){const r=S.resources;let e='stable',t='',tx='';if(r.prestige>60&&r.income>50&&r.education>50){e='ascending';t='Восходящая мобильность';tx='Твой персонаж поднялся в социальной структуре благодаря образованию, работе и связям.'}else if(r.innerStability>50&&r.familyWellbeing>50&&Math.abs(r.income-50)<20){e='stable';t='Устойчивое среднее положение';tx='Твой персонаж нашёл баланс между семьёй, работой и обществом.'}else if(r.income<25&&r.prestige<25){e='descending';t='Нисходящая мобильность';tx='Твой персонаж потерял социальное положение из-за кризиса или неверных решений.'}else if(r.socialConnections>60&&S.conflicts.length>=2){e='bridge';t='Социальный мост';tx='Твой персонаж стал посредником, помогающим разрешать конфликты.'}else if(r.socialConnections<20&&r.familyWellbeing<30){e='loner';t='Одиночка';tx='Твой персонаж отверг институты и связи, но оказался уязвим.'}else if(r.power>60&&r.reputation<40){e='systemic';t='Системный игрок';tx='Твой персонаж научился использовать систему, но столкнулся с моральным выбором.'}else if(r.prestige>55&&r.education>55&&r.socialConnections>55){e='architect';t='Архитектор Социума';tx='Твой персонаж понял общество как систему и получил возможность влиять на городские правила.'}S.ending=e;document.getElementById('ending-content').innerHTML=(SVGS.passport?'<div class="scene-img" style="max-width:300px">'+SVGS.passport+'</div>':'')+'<h1 class="ending-title">'+t+'</h1><p class="ending-text">'+tx+'</p><div class="passport"><h2>📋 Социологический паспорт</h2><div style="background:rgba(155,89,182,.15);padding:1rem;border-radius:12px;border:2px solid var(--purple);margin-bottom:1rem;text-align:center"><div style="font-size:.85rem;color:var(--dim)">Ваш код ученика:</div><div style="font-size:1.5rem;font-family:monospace;font-weight:800;color:var(--purple)">'+S.studentCode+'</div></div><div class="passport-row"><span>Имя:</span><span>'+S.name+'</span></div><div class="passport-row"><span>Район:</span><span>'+S.district+'</span></div><div class="passport-row"><span>Семья:</span><span>'+S.family+'</span></div><div class="passport-row"><span>Страта:</span><span>'+S.strata+'</span></div><div class="passport-row"><span>Сцен пройдено:</span><span>'+S.sceneHistory.length+'</span></div><div class="passport-row"><span>Статусы:</span><span>'+S.achievedStatuses.length+'</span></div><div class="passport-row"><span>Роли:</span><span>'+S.roles.length+'</span></div><div class="passport-row"><span>Лифты:</span><span>'+(S.socialLifts.join(', ')||'нет')+'</span></div><div class="passport-row"><span>Мобильность:</span><span>'+(S.mobilityEvents.join(', ')||'нет')+'</span></div></div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px"><button class="menu-btn btn-new" onclick="resetGame()">Пройти заново</button><button class="menu-btn btn-download" onclick="exportProgress()">📤 Экспорт для учителя</button><button class="menu-btn btn-rules" onclick="showScreen(\'start\')">В меню</button></div>';showScreen('ending')}
function resetGame(){localStorage.removeItem(SAVE_KEY);S=null;showScreen('start')}
function startMinigame(type,next){const a=document.getElementById('game-area');let h='<div class="minigame-area">';if(type==='web'){h+='<h2 style="color:var(--yellow);margin-bottom:1rem">🕸️ Паутина общества</h2><p style="color:var(--dim);margin-bottom:1rem">Соедини элементы. Нажимай на два элемента, чтобы создать связь. Нужно 5 связей.</p><div id="web-nodes" style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:1rem 0"></div><p id="web-count" style="color:var(--accent);margin:1rem 0">Связей: 0/5</p><button class="menu-btn btn-new" id="web-done" style="display:none" onclick="completeMinigame(\''+next+'\',80)">Завершить ✓</button>'}else if(type==='pyramid'){h+='<h2 style="color:var(--yellow);margin-bottom:1rem">🔺 Социальная пирамида</h2><p style="color:var(--dim);margin-bottom:1rem">Распредели людей по слоям. Нажимай, чтобы переместить в следующий слой.</p><div id="pyr-people"></div><button class="menu-btn btn-new" onclick="completeMinigame(\''+next+'\',70)" style="margin-top:1rem">Завершить ✓</button>'}else if(type==='elevator'){h+='<h2 style="color:var(--yellow);margin-bottom:1rem">🏢 Социальный лифт</h2><p style="color:var(--dim);margin-bottom:1rem">Выбери правильные каналы мобильности.</p><div id="elev-q"></div>'}else if(type==='conflict'){h+='<h2 style="color:var(--yellow);margin-bottom:1rem">🔗 Конфликтный узел</h2><p style="color:var(--dim);margin-bottom:1rem">Определи причину и повод конфликта.</p><div id="conf-q"></div>'}else if(type==='institutions'){h+='<h2 style="color:var(--yellow);margin-bottom:1rem">🏛️ Институциональный пазл</h2><p style="color:var(--dim);margin-bottom:1rem">Определи, к какому институту относится ситуация.</p><div id="inst-q"></div>'}h+='</div>';a.innerHTML=h;if(type==='web')initWeb();else if(type==='pyramid')initPyr();else if(type==='elevator')initElev(next);else if(type==='conflict')initConf(next);else if(type==='institutions')initInst(next)}
function completeMinigame(next,score){S.minigameScores[next]=score;const b=Math.round(score/100*10);S.resources.education=Math.min(100,S.resources.education+b);S.resources.reputation=Math.min(100,S.resources.reputation+Math.round(b/2));S.currentScene=next;renderScene();window.scrollTo(0,0)}
function initWeb(){const nodes=['Человек','Группа','Институт','Сфера жизни','Норма','Ценность','Символ'];const valid=[['Человек','Группа'],['Группа','Институт'],['Институт','Сфера жизни'],['Сфера жизни','Норма'],['Норма','Ценность'],['Ценность','Символ'],['Человек','Институт'],['Группа','Норма']];let sel=null,conn=[];const c=document.getElementById('web-nodes');nodes.forEach(n=>{const b=document.createElement('button');b.className='choice-btn';b.style.cssText='padding:10px 16px;font-size:.9rem;flex:0 0 auto';b.textContent=n;b.onclick=()=>{if(!sel){sel=n;b.style.borderColor='var(--accent)';b.style.background='rgba(0,212,170,.2)'}else if(sel!==n){const p=[sel,n].sort();const isV=valid.some(v=>v[0]===p[0]&&v[1]===p[1]);if(isV&&!conn.includes(p.join('-'))){conn.push(p.join('-'));document.getElementById('web-count').textContent='Связей: '+conn.length+'/5';if(conn.length>=5)document.getElementById('web-done').style.display='block'}c.querySelectorAll('button').forEach(x=>{x.style.borderColor='rgba(255,255,255,.12)';x.style.background='linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.02))'});sel=null}else{c.querySelectorAll('button').forEach(x=>{x.style.borderColor='rgba(255,255,255,.12)';x.style.background='linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.02))'});sel=null}};c.appendChild(b)})}
function initPyr(){const p=[{name:'Топ-менеджер',layer:'Элита'},{name:'Врач',layer:'Средний слой'},{name:'Рабочий',layer:'Низший слой'},{name:'Депутат',layer:'Элита'},{name:'Предприниматель',layer:'Высший слой'},{name:'Студент',layer:'Низший слой'}];const l=['Элита','Высший слой','Средний слой','Низший слой'];const c=document.getElementById('pyr-people');p.forEach((x,i)=>{x.cur=0;const d=document.createElement('div');d.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:10px;margin:5px 0;background:rgba(255,255,255,.05);border-radius:10px';d.innerHTML='<span>'+x.name+'</span><button class="nav-btn" id="pyr-btn-'+i+'" onclick="cyclePyr('+i+')">'+l[0]+'</button>';c.appendChild(d)});window._pp=p;window._pl=l}
function cyclePyr(i){const p=window._pp[i];p.cur=(p.cur+1)%window._pl.length;document.getElementById('pyr-btn-'+i).textContent=window._pl[p.cur]}
function initElev(next){const qs=[{q:'Что является социальным лифтом?',o:['Образование','Переезд','Смена причёски'],c:0},{q:'Брак с человеком другого статуса — это...',o:['Горизонтальная мобильность','Вертикальная мобильность','Не мобильность'],c:1},{q:'Что НЕ является социальным лифтом?',o:['Карьера','Лотерея','Случайная встреча'],c:2}];let qi=0,sc=0;function r(){const c=document.getElementById('elev-q');if(qi>=qs.length){c.innerHTML='<p style="color:var(--accent);font-size:1.2rem;margin:1rem 0">Результат: '+sc+'/'+qs.length+'</p><button class="menu-btn btn-new" onclick="completeMinigame(\''+next+'\','+Math.round(sc/qs.length*100)+')">Завершить ✓</button>';return}const q=qs[qi];c.innerHTML='<h3 style="color:var(--yellow);margin:1rem 0">'+q.q+'</h3>';q.o.forEach((x,i)=>{const b=document.createElement('button');b.className='choice-btn';b.style.cssText='margin:5px 0';b.textContent=x;b.onclick=()=>{if(i===q.c)sc++;qi++;r()};c.appendChild(b)})}r()}
function initConf(next){const qs=[{s:'Соседи ссорятся из-за шума. Один недавно потерял работу.',ca:'Стресс и неравенство',ex:'Громкая музыка',oc:['Стресс и неравенство','Громкая музыка','Плохая изоляция'],oe:['Громкая музыка','Стресс','Плохой характер']},{s:'Коллеги конфликтуют из-за проекта. Один чувствует, что его не ценят.',ca:'Неравное признание',ex:'Спор о деталях',oc:['Неравное признание','Спор о деталях','Личная неприязнь'],oe:['Спор о деталях проекта','Неравное признание','Разные характеры']}];let qi=0,sc=0;function r(){const c=document.getElementById('conf-q');if(qi>=qs.length){c.innerHTML='<p style="color:var(--accent);font-size:1.2rem;margin:1rem 0">Результат: '+sc+'/'+(qs.length*2)+'</p><button class="menu-btn btn-new" onclick="completeMinigame(\''+next+'\','+Math.round(sc/(qs.length*2)*100)+')">Завершить ✓</button>';return}const q=qs[qi];c.innerHTML='<p style="color:var(--coral);font-style:italic;margin:1rem 0">«'+q.s+'»</p><h4 style="color:var(--purple);margin:.5rem 0">🔍 Причина:</h4>';q.oc.forEach(o=>{const b=document.createElement('button');b.className='choice-btn';b.style.cssText='margin:3px 0;font-size:.9rem';b.textContent=o;b.onclick=()=>{if(o===q.ca)sc++;rE()};c.appendChild(b)})}function rE(){const q=qs[qi];const c=document.getElementById('conf-q');c.innerHTML+='<h4 style="color:var(--yellow);margin:.5rem 0">⚡ Повод:</h4>';q.oe.forEach(o=>{const b=document.createElement('button');b.className='choice-btn';b.style.cssText='margin:3px 0;font-size:.9rem';b.textContent=o;b.onclick=()=>{if(o===q.ex)sc++;qi++;r()};c.appendChild(b)})}r()}
function initInst(next){const qs=[{s:'Рождение ребёнка, регистрация брака',c:'Семья',o:['Семья','Образование','Политика','Экономика']},{s:'Поступление в университет',c:'Образование',o:['Семья','Образование','Право','Религия']},{s:'Покупка товара',c:'Экономика',o:['Экономика','Политика','Культура','Семья']},{s:'Выборы президента',c:'Политика',o:['Право','Политика','Экономика','Культура']},{s:'Суд, защита прав',c:'Право',o:['Политика','Право','Религия','Экономика']}];let qi=0,sc=0;function r(){const c=document.getElementById('inst-q');if(qi>=qs.length){c.innerHTML='<p style="color:var(--accent);font-size:1.2rem;margin:1rem 0">Результат: '+sc+'/'+qs.length+'</p><button class="menu-btn btn-new" onclick="completeMinigame(\''+next+'\','+Math.round(sc/qs.length*100)+')">Завершить ✓</button>';return}const q=qs[qi];c.innerHTML='<p style="color:var(--purple);font-style:italic;margin:1rem 0">«'+q.s+'»</p>';q.o.forEach(o=>{const b=document.createElement('button');b.className='choice-btn';b.style.cssText='margin:5px 0';b.textContent=o;b.onclick=()=>{if(o===q.c)sc++;qi++;r()};c.appendChild(b)})}r()}
function renderTeacher(){const d=localStorage.getItem('socicum_teacher_data');const st=d?JSON.parse(d):[];const l=document.getElementById('teacher-list');const s=document.getElementById('teacher-stats');if(!st.length){s.innerHTML='';l.innerHTML='<p style="color:var(--dim);text-align:center;padding:2rem">Пока нет импортированных результатов</p>';return}const avg=st.reduce((a,b)=>a+b.grade,0)/st.length;s.innerHTML='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1rem"><div style="background:rgba(0,212,170,.1);padding:1rem;border-radius:12px;text-align:center"><div style="font-size:2rem;font-weight:800;color:var(--accent)">'+st.length+'</div><div style="font-size:.8rem;color:var(--dim)">Учеников</div></div><div style="background:rgba(255,215,0,.1);padding:1rem;border-radius:12px;text-align:center"><div style="font-size:2rem;font-weight:800;color:var(--yellow)">'+avg.toFixed(1)+'</div><div style="font-size:.8rem;color:var(--dim)">Средняя оценка</div></div><div style="background:rgba(74,222,128,.1);padding:1rem;border-radius:12px;text-align:center"><div style="font-size:2rem;font-weight:800;color:var(--green)">'+st.filter(x=>x.progress.ending).length+'</div><div style="font-size:.8rem;color:var(--dim)">Завершили</div></div></div><div style="margin-top:1rem;display:flex;gap:10px;flex-wrap:wrap"><button class="nav-btn" onclick="exportReport()">📄 Отчёт TXT</button><button class="nav-btn" onclick="exportCSV()">📊 Экспорт CSV</button></div>';l.innerHTML=st.map(x=>'<div class="teacher-student" onclick="viewStudent(\''+x.code+'\')"><div style="display:flex;justify-content:space-between;align-items:center"><div><strong style="color:var(--yellow);font-family:monospace">'+x.code+'</strong> · '+x.name+'</div><div style="display:flex;gap:10px;align-items:center"><span style="padding:4px 12px;border-radius:20px;font-weight:700;background:'+(x.grade>=4?'rgba(74,222,128,.2)':'rgba(255,107,107,.2)')+';color:'+(x.grade>=4?'var(--green)':'var(--coral)')+'">'+x.grade+'</span><span style="color:var(--dim);font-size:.85rem">'+x.progress.sceneHistory.length+' сцен</span></div></div></div>').join('')}
function importStudents(e){const f=e.target.files;if(!f)return;const d=localStorage.getItem('socicum_teacher_data');const st=d?JSON.parse(d):[];Array.from(f).forEach(file=>{const r=new FileReader();r.onload=ev=>{try{const x=JSON.parse(ev.target.result);if(!x.progress||!x.studentCode)return;const g=calcGrade(x.progress);const ex=st.findIndex(s=>s.code===x.studentCode);const s={code:x.studentCode,name:x.progress.name||'Неизвестный',grade:g,comment:'',progress:x.progress,importedAt:new Date().toISOString()};if(ex>=0)st[ex]=s;else st.push(s);localStorage.setItem('socicum_teacher_data',JSON.stringify(st));renderTeacher();toast('✅ Импортировано: '+x.studentCode)}catch(err){toast('❌ Ошибка: '+file.name)}};r.readAsText(file)});e.target.value=''}
function calcGrade(p){let s=0;s+=Math.min(30,(p.sceneHistory.length/30)*30);if(p.minigameScores){const v=Object.values(p.minigameScores);if(v.length)s+=(v.reduce((a,b)=>a+b,0)/v.length/100)*25}s+=Math.min(20,(p.achievements.length/10)*20);if(p.ending){s+=10;if(['ascending','stable','bridge','architect'].includes(p.ending))s+=5}s+=Math.min(10,(p.journal.length/8)*10);const pct=s;return pct>=90?5:pct>=75?4:pct>=60?3:pct>=40?2:1}
function viewStudent(code){const d=JSON.parse(localStorage.getItem('socicum_teacher_data')||'[]');const s=d.find(x=>x.code===code);if(!s)return;const mc=document.getElementById('modal-content');mc.innerHTML='<h2>👤 '+s.name+'</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem"><div><div style="font-size:.8rem;color:var(--dim)">Код</div><div style="font-family:monospace;color:var(--yellow)">'+s.code+'</div></div><div><div style="font-size:.8rem;color:var(--dim)">Район</div><div>'+(s.progress.district||'—')+'</div></div></div><div style="background:rgba(255,255,255,.05);padding:1rem;border-radius:12px;margin-bottom:1rem"><h4 style="color:var(--accent);margin-bottom:.5rem">📊 Прогресс</h4><div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;font-size:.85rem"><div>Сцен: <strong>'+s.progress.sceneHistory.length+'</strong></div><div>Статусов: <strong>'+s.progress.achievedStatuses.length+'</strong></div><div>Ролей: <strong>'+s.progress.roles.length+'</strong></div><div>Страта: <strong>'+s.progress.strata+'</strong></div><div>Финал: <strong>'+(s.progress.ending||'нет')+'</strong></div></div></div><div style="margin-bottom:1rem"><label style="display:block;color:var(--dim);margin-bottom:.5rem">Оценка (авто: '+s.grade+')</label><div style="display:flex;gap:5px">'+[5,4,3,2,1].map(g=>'<button class="nav-btn" style="flex:1;'+(s.grade===g?'background:var(--accent);color:#0d0b2e':'')+'" onclick="setGrade(\''+code+'\','+g+')">'+g+'</button>').join('')+'</div></div><label style="display:block;color:var(--dim);margin-bottom:.5rem">Комментарий</label><textarea id="tc" style="width:100%;padding:10px;border-radius:8px;border:2px solid rgba(255,255,255,.1);background:var(--bg);color:var(--text);font-family:inherit;min-height:60px" placeholder="Комментарий...">'+(s.comment||'')+'</textarea><br><br><button class="menu-btn btn-new" onclick="saveGrade(\''+code+'\')">💾 Сохранить</button><button class="menu-btn btn-settings" onclick="closeModal()">Закрыть</button>';document.getElementById('modal-overlay').classList.add('show')}
function setGrade(code,g){const d=JSON.parse(localStorage.getItem('socicum_teacher_data')||'[]');const s=d.find(x=>x.code===code);if(s)s.grade=g;localStorage.setItem('socicum_teacher_data',JSON.stringify(d));viewStudent(code)}
function saveGrade(code){const d=JSON.parse(localStorage.getItem('socicum_teacher_data')||'[]');const s=d.find(x=>x.code===code);if(s){s.comment=document.getElementById('tc').value;localStorage.setItem('socicum_teacher_data',JSON.stringify(d))}closeModal();renderTeacher();toast('✅ Сохранено')}
function exportReport(){const d=JSON.parse(localStorage.getItem('socicum_teacher_data')||'[]');if(!d.length){toast('❌ Нет данных');return}let r='ОТЧЁТ ПО ИГРЕ "СОЦИУМ"\n========================\n\nДата: '+new Date().toLocaleDateString('ru-RU')+'\nУчеников: '+d.length+'\n';const avg=d.reduce((a,b)=>a+b.grade,0)/d.length;r+='Средняя оценка: '+avg.toFixed(2)+'\n\n';d.forEach((s,i)=>{r+=(i+1)+'. '+s.name+' ('+s.code+')\n   Оценка: '+s.grade+'\n   Комментарий: '+(s.comment||'—')+'\n   Сцен: '+s.progress.sceneHistory.length+'\n   Страта: '+s.progress.strata+'\n   Финал: '+(s.progress.ending||'—')+'\n\n'});const b=new Blob([r],{type:'text/plain;charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='СОЦИУМ_отчёт.txt';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);toast('📄 Отчёт скачан')}
function exportCSV(){const d=JSON.parse(localStorage.getItem('socicum_teacher_data')||'[]');if(!d.length){toast('❌ Нет данных');return}const rows=[['Код','Имя','Оценка','Комментарий','Сцен','Страта','Финал']];d.forEach(s=>rows.push([s.code,s.name,s.grade,s.comment||'',s.progress.sceneHistory.length,s.progress.strata,s.progress.ending||'']));const csv='\uFEFF'+rows.map(r=>r.join(';')).join('\n');const b=new Blob([csv],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='СОЦИУМ_результаты.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);toast('📊 CSV скачан')}
document.getElementById('start-logo').innerHTML=SVGS.network;
</script>
